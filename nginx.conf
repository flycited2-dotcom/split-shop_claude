server {
    listen 80;
    server_name splithome.ru www.splithome.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name splithome.ru www.splithome.ru;

    ssl_certificate /etc/letsencrypt/live/splithome.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/splithome.ru/privkey.pem;

    client_max_body_size 20M;

    location /static/ {
        alias /opt/splithome/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /opt/splithome/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }
}
