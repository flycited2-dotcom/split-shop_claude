{% extends "base.html" %}
{% block title %}Подбор кондиционера{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto py-10 px-4">
  <h1 class="text-3xl font-bold text-gray-900 mb-2">Подбор кондиционера</h1>
  <p class="text-gray-500 mb-8">Заполните форму — наш специалист подберёт оборудование под ваши задачи и перезвонит.</p>
  <form hx-post="{% url 'selection_submit' %}" hx-target="#selection-result" hx-swap="innerHTML"
        class="bg-white rounded-xl border border-gray-200 p-6 space-y-4">
    {% csrf_token %}
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Имя *</label>
        <input type="text" name="name" required
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Телефон *</label>
        <input type="tel" name="phone" required placeholder="+7 (___) ___-__-__"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Город</label>
        <input type="text" name="city"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Площадь, м²</label>
        <input type="number" name="area_sqm" min="1"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Тип помещения</label>
        <input type="text" name="room_type" placeholder="Квартира, офис, магазин..."
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Бюджет</label>
        <input type="text" name="budget" placeholder="до 50 000 ₽"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Когда планируется покупка</label>
        <input type="text" name="timeline" placeholder="В течение месяца"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="flex items-center gap-2 pt-5">
        <input type="checkbox" name="needs_installation" id="needs_installation" class="rounded">
        <label for="needs_installation" class="text-sm text-gray-700">Нужен монтаж</label>
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Комментарий</label>
      <textarea name="comment" rows="3"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
    </div>
    <button type="submit"
            class="bg-blue-600 text-white rounded-lg px-6 py-2 text-sm font-medium hover:bg-blue-700 transition-colors">
      Отправить заявку
    </button>
  </form>
  <div id="selection-result" aria-live="polite" class="mt-4"></div>
</div>
{% endblock %}
