{% extends 'base.html' %}
{% block title %}Бренды — Oasis{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Бренды</h1>
<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
  {% for brand in brands %}
    <div class="card p-6 flex items-center justify-center hover:shadow-md transition">
      <span class="font-bold text-gray-700 text-lg">{{ brand.title }}</span>
    </div>
  {% empty %}
    <p class="col-span-6 text-gray-400 text-center py-12">Бренды не загружены</p>
  {% endfor %}
</div>
{% endblock %}
