version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: always
    networks:
      default:
        ipv4_address: 172.30.0.20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

  web:
    build: .
    restart: always
    command: gunicorn splithome.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      # Выгрузка Профконда (b2b-jac.com) от скрапера osatakti_mdv_b2b — те же
      # файлы читает Telegram-бот остатков. Только на чтение: пишет сюда
      # скрапер, сайт лишь забирает (см. apps/sync/jac_catalog.py).
      - /opt/splithub_api_telegram/data:/data/jac:ro
      # Статьи робота автовыкладки (/articles/). Только чтение: пишет туда
      # робот, сайт лишь показывает (apps/articles/loader.py, ARTICLES_DIR).
      - /var/lib/articles-robot/splithome.ru:/data/articles:ro
    ports:
      - "8000:8000"
    env_file: .env
    # api.telegram.org резолвится обычным DNS: с 10.11.2026 IPv4 Telegram с VPS
    # доступен, а IPv6-прокси tg_proxy упирается в таймауты (см. его логи).
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build: .
    restart: always
    command: celery -A splithome worker -l info -c 2
    volumes:
      # sync_jac выполняется воркером — ему нужны те же файлы, что и web.
      - /opt/splithub_api_telegram/data:/data/jac:ro
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  beat:
    build: .
    restart: always
    command: celery -A splithome beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  tg_proxy:
    image: alpine/socat:latest
    command: TCP4-LISTEN:9443,bind=172.30.0.1,fork,reuseaddr TCP6:api.telegram.org:443
    network_mode: host
    restart: always

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
